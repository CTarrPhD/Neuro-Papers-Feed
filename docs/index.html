ing in human cells", "s": "Nature Biotechnology", "m": "Nature Biotechnology, Published online: 21 October 2026; doi:10.1038/s41587-026-03327-6 Recordanelles continuously and unbiasedly record the transcriptome throughout time in living mammalian cells.", "d": "2026-10-21", "dl": "Wednesday, October 21", "y": "research"}, {"l": "https://www.nature.com/articles/s41380-026-03947-z", "t": "Breast carcinoma amplified sequence 2 rescues adult hippocampal neurogenesis and cognitive deficits in Alzheimer’s disease via regulating BDNF/TrkB signaling", "s": "Molecular Psychiatry", "m": "Molecular Psychiatry, Published online: 21 October 2026; doi:10.1038/s41380-026-03947-z Breast carcinoma amplified sequence 2 rescues adult hippocampal neurogenesis and cognitive deficits in Alzheimer’s disease via regulating BDNF/TrkB signaling", "d": "2026-10-21", "dl": "Wednesday, October 21", "y": "research"}, {"l": "https://www.cell.com/neuron/fulltext/S0896-6273(26)00693-8?rss=yes", "t": "Running in reverse: Tau redirects mitochondrial electron flow toward neurodegeneration", "s": "Neuron", "m": "In this issue of Neuron, Li et al. show that tau enters mitochondria and binds NDUFS3 to regulate reverse electron transport (RET) in a phosphorylation-dependent manner. RET promotes tau phosphorylation, forming a self-perpetuating loop that is exacerbated with stress and tauopathy.", "d": "2026-10-21", "dl": "Wednesday, October 21", "y": "research"}, {"l": "https://www.cell.com/neuron/fulltext/S0896-6273(26)00733-6?rss=yes", "t": "Optimizing learning for control of human-machine interfaces", "s": "Neuron", "m": "Human-machine interfaces, such as augmented reality devices, hand prostheses, and brain-computer interfaces, are increasingly being used in neurorehabilitation. In this issue of Neuron, Vassiliadis et al. examine the interaction between closed-loop continuous reinforcement and sensory feedback in learning of human-machine interface control.", "d": "2026-10-21", "dl": "Wednesday, October 21", "y": "research"}, {"l": "https://www.nature.com/articles/d41586-026-03357-9", "t": "Teen depression and anxiety predicted by childhood brain development", "s": "Nature", "m": "Nature, Published online: 21 October 2026; doi:10.1038/d41586-026-03357-9 Analysis of nearly 30,000 brain scans yields detailed timeline of how the brain matures — and hints at the consequences of disrupting it.", "d": "2026-10-21", "dl": "Wednesday, October 21", "y": "research"}, {"l": "https://www.nature.com/articles/d41586-026-03334-2", "t": "Huge mapping study reveals how your brain tracks what your body is feeling", "s": "Nature", "m": "Nature, Published online: 21 October 2026; doi:10.1038/d41586-026-03334-2 Signals in the insula region, deep in the brain, can make people feel hot, tingly and nauseous.", "d": "2026-10-21", "dl": "Wednesday, October 21", "y": "research"}, {"l": "https://www.nature.com/articles/s41586-026-11186-z", "t": "CD51 delineates functionally distinct astrocyte subtypes in neural circuits", "s": "Nature", "m": "Nature, Published online: 21 October 2026; doi:10.1038/s41586-026-11186-z CD51+ astrocytes promote synapse formation in the developing cortex, circuit plasticity in the hippocampus and circuit remodelling after stroke.", "d": "2026-10-21", "dl": "Wednesday, October 21", "y": "research"}, {"l": "https://www.nature.com/articles/s41586-026-11165-4", "t": "Persistent neuronal stress signalling underlies Angelman syndrome phenotypes", "s": "Nature", "m": "Nature, Published online: 21 October 2026; doi:10.1038/s41586-026-11165-4 Genetic and proteomic analyses in human neurons and mouse models of Angelman syndrome (AS) show that loss of the ubiquitin ligase UBE3A leads to an overabundance of asparagine synthetase, and that this is linked with many AS phenotypes.", "d": "2026-10-21", "dl": "Wednesday, October 21", "y": "research"}, {"l": "https://elifesciences.org/articles/109757", "t": "A mechanistic theory of planning in prefrontal cortex", "s": "eLife", "m": "Planning is critical for adaptive behaviour in a changing world, because it lets us anticipate the future and adjust our actions accordingly. While prefrontal cortex is crucial for this process, it remains unknown how planning is implemented in neural circuits. Prefrontal representations were recently discovered in simpler sequence memory tasks, where different populations of neurons represent different future time points. We demonstrate that combining such representations with the ubiquitous principle of neural attractor dynamics allows circuits to solve much richer problems, including planning. This is achieved by embedding the environment structure directly in synaptic connections to impl", "d": "2026-10-21", "dl": "Wednesday, October 21", "y": "research"}, {"l": "https://elifesciences.org/articles/111177", "t": "Complementary stable and dynamic prelimbic ensembles encode learned threat value underlying generalization and discrimination", "s": "eLife", "m": "Adaptive behavior requires assigning emotional value to sensory cues and generalizing to similar stimuli. The prelimbic cortex (PL) is critical for threat expression and discrimination, yet its neuronal ensembles undergo substantial turnover over time. How stable population codes emerge despite this reorganization remains unknown. Using longitudinal calcium imaging in freely moving mice, we tracked PL activity for 30 days during auditory discriminative fear learning and retrieval. Despite substantial ensemble turnover, stable graded representations persisted in PL populations. A generalized linear model showed that the tone threat value explained graded activity better than freezing, indicat", "d": "2026-10-21", "dl": "Wednesday, October 21", "y": "research"}, {"l": "https://elifesciences.org/articles/109678", "t": "Strong mnemonic prediction errors increase cognitive control, attention, and arousal", "s": "eLife", "m": "Ongoing experience is continuously processed in the context of past events. Divergence between current experience and memory-based predictions (i.e., a mnemonic prediction error; MPE) is theorized to be a signal that encoding, as opposed to retrieval, should be prioritized. We asked how MPEs place demands on control and attention-related processes, and whether these demands differ as a function of prediction strength. We investigated these questions across two experiments, wherein we recorded scalp electroencephalography and/or pupillometry as 101 young human adults performed an associative memory task. Strong MPEs, more so than weak MPEs, increased physiological indices of cognitive control", "d": "2026-10-21", "dl": "Wednesday, October 21", "y": "research"}, {"l": "https://www.biorxiv.org/content/10.64898/2026.10.15.759256v1?rss=1", "t": "PETRO enables robust estimation of on-target perturbation effects in Perturb-seq", "s": "bioRxiv Genomics", "m": "Perturb-seq uses multiple guides per target as replicates, but off-target effects can bias target-level estimates even with efficient target perturbation. We present PETRO, which recovers the on-target perturbation effect while allowing, for each outcome, an unknown minority of guides to have arbitrary off-target effects. Across CRISPRa and CRISPRi datasets, sequence-associated off-target bias persisted after pooling cells across guides and nearly doubled in one CRISPRa dataset after a published guide filter. PETRO largely removed this bias and reduced transmission of effects from independently flagged promiscuous guides. In simulations, PETRO nearly matched pooling in power without off-targ", "d": "2026-10-21", "dl": "Wednesday, October 21", "y": "preprints"}, {"l": "https://www.cell.com/cell-reports/fulltext/S2211-1247(26)01271-4?rss=yes", "t": "Optogenetic reduction of theta oscillations induces remapping of time cells without memory impairment", "s": "Cell Reports", "m": "Yong et al. show that inhibiting medial septum GABAergic neurons substantially reduces hippocampal theta rhythm and partially re anscriptome-wide monitoring of translation activity in vivo, but its use is limited by lengthy protocols, reliance on specialized equipment and inefficient recovery of ribosome-protected fragments (RPFs). To overcome these challenges, we developed RAPPL-Seq, a magnetic bead-based affinity capture method that enables fast and efficient RPF isolation. RAPPL-Seq achieves high recovery efficiency, short processing time, and robust performance with limited input material. It is broadly applicable across multiple sample types, including cell lines, primary tissues, and human biospecimens. RAPPL-Seq can also be paired with translation inhibitors to char", "d": "2026-10-21", "dl": "Wednesday, October 21", "y": "preprints"}, {"l": "https://www.biorxiv.org/content/10.64898/2026.10.15.759469v1?rss=1", "t": "Robust Identification of Drug Mechanism of Action Associated Genes Across Heterogeneous Drug Treated Datasets", "s": "bioRxiv Bioinformatics", "m": "Identifying genes associated with the mechanism of action (MOA) of anticancer therapies is essential for understanding drug response. Functional genomics approaches, including genome-wide CRISPR knock out screens, enable systematic gene prioritization following treatment; however, findings from individual datasets are typically interpreted after identifying overlapping genes across datasets to confirm biological hypotheses. Integrating such heterogeneous datasets remains challenging due to variability across experimental conditions. Existing approaches can miss biologically relevant genes due to dataset-specific noise, can fail to capture genes exhibiting consistent but moderate effects acro", "d": "2026-10-21", "dl": "Wednesday, October 21", "y": "preprints"}, {"l": "https://www.biorxiv.org/content/10.64898/2026.10.15.758756v1?rss=1", "t": "CPMsi: a data-driven Computational Pipeline for fast, large-scale Mass Spectrometry Imaging analysis", "s": "bioRxiv Bioinformatics", "m": "Mass Spectrometry Imaging (MSI) is increasingly used in clinical research to characterize tissue heterogeneity and identify disease-associated molecular patterns while preserving spatial context. However, translating MSI to large patient cohort studies remains challenging because, among others, existing computational tools struggle to scale with the size and complexity of such datasets. To overcome this bottleneck, we developed CPMsi, a scalable, data-driven computational pipeline for cohort-scale MSI analysis. CPMsi directly processes raw MSI data, performs global spectral alignment using a novel binning strategy, identifies regions of molecular similarity, and generates consensus spectra t", "d": "2026-10-21", "dl": "Wednesday, October 21", "y": "preprints"}, {"l": "https://www.biorxiv.org/content/10.64898/2026.10.15.759380v1?rss=1", "t": "GENOAR: Global Engine for Navigating the Omnicell space via Agent-based Research", "s": "bioRxiv Bioinformatics", "m": "Although generative models have revolutionized many fields, including genomics, building a scalable dataset compatible with artificial intelligence (AI) is essential yet underexplored. Here, we developed a Global Engine for navigating the Omnicell space via Agent-based Research (GENOAR) that covers approximately 54 million cells for diverse downstream tasks using AI agents and parallel computing. GENOAR outperforms in three parts. Parallel computations accelerated the preprocessing of single-cell transcriptomic data; the other components enabled agent-assisted data storage and exploration for both AI models and humans. GENOAR involves two AI agents: an AI nomenclaturist ordered the unstructu", "d": "2026-10-21", "dl": "Wednesday, October 21", "y": "preprints"}, {"l": "https://www.biorxiv.org/content/10.64898/2026.10.15.758670v1?rss=1", "t": "CnidoSite: A Multi-Omics Database for Cnidarians", "s": "bioRxiv Bioinformatics", "m": "The phylum Cnidaria, encompassing reef-building corals, sea anemones, hydroids, and jellyfish, includes both ecological keystones of om which developmental and disease-associated trajectories can be reconstructed. Existing optimal-transport and flow-matching approaches typically infer temporal couplings at the level of individual cells, with limited representation of the local manifold geometry of cell-state space and the uncertainty inherent in lineage diversification. We introduce LoCoFlow, a flow-matching framework that combines local point-cloud geometry with conditional fate uncertainty. Overlapping patches define hierarchical transport between populations, and an endpoint-preserving neural bridge regulariz", "d": "2026-10-21", "dl": "Wednesday, October 21", "y": "preprints"}, {"l": "https://www.biorxiv.org/content/10.64898/2026.10.15.759369v1?rss=1", "t": "BiNVaST: niche boundary-preserving and synthetic data-guided variational autoencoders for concordant inference across high-resolution spatial transcriptomic platforms", "s": "bioRxiv Bioinformatics", "m": "High-resolution spatial transcriptomics (ST) enables subcellular spatially resolved transcript profiling but remains difficult to annotate in complex tissues because of gene coverage and super sparseness in expression. These challenges are amplified in cancer research, where neoplastic cell states and rare immune cells in tumor microenvironment are often poorly captured by generic references and/or cell typing tools exclusively built on molecular profile. Here, we present BiNVaST, a niche boundary-preserving and dual-branch variational autoencoder fused with statistical simulator for reliable cell typing across multiple spatial platforms. It generates platform-adjusted in silico training dat", "d": "2026-10-21", "dl": "Wednesday, October 21", "y": "preprints"}, {"l": "https://www.biorxiv.org/content/10.64898/2026.10.20.760189v1?rss=1", "t": "Evaluation of object detection neural networks to find topologically associated domains in bulk Hi-C data", "s": "bioRxiv Bioinformatics", "m": "Topologically associated domains (TADs) shape the three-dimensional structure of chromatin and contribute to gene regulation by arranging regulatory elements and genes in spatial proximity. This spatial proximity is captured by Hi-C, an experimental method, which quantifies contact frequencies between all pairs of genomic loci. In bulk Hi-C data, TADs can be found in the form of gapped, nested and partially overlapping squares centered on the main diagonal of the Hi-C matrix. We shift the problem of TAD identification into the domain of computer vision by detecting TADs in Hi-C in the form of squares in images. For this we use object detection, which aims to classify object instances in imag", "d": "2026-10-21", "dl": "Wednesday, October 21", "y": "preprints"}, {"l": "https://www.biorxiv.org/content/10.64898/2026.10.19.760196v1?rss=1", "t": "hvantk: an agentic multi-omics framework for variant annotation and analysis", "s": "bioRxiv Bioinformatics", "m": "Large-scale genetic variant analysis involves multiple computational steps, data formats, gene and variant annotation sources and compute requirements. Some of the steps like joint calling for large cohorts are run on large compute clusters, while gene/variant classification algorithms can be run in a desktop computer. At the same time, variant annotations such as gene expression and gene constraints metrics from gnomAD are provided in different formats, by resources that frequently change their versions. Here, we present hvantk, a framework that provides a common data model for large-scale annotation and analysis of genetic variants, by extending popular data formats such as Hail MatrixTabl", "d": "2026-10-21", "dl": "Wednesday, October 21", "y": "preprints"}, {"l": "https://www.biorxiv.org/content/10.64898/2026.10.20.760332v1?rss=1", "t": "RiboTxAlign maps and quantifies ribosome footprints using sample-specific transcript references", "s": "bioRxiv Bioinformatics", "m": "Background: Ribosome-profiling reads are short and often map to several genomic locations or t ysbiosis is well established, it remains unclear whether these alterations persist long-term and can be therapeutically modulated. This study addresses this gap through integrated metagenomic and metabolomic profiling in two independent clinical stroke cohorts, complemented by experimental models. Experimental stroke induced persistent changes in gut microbiota composition and altered short-chain fatty acid profiles. In patients, microbiota composition remained distinct from controls up to three months after ischemic stroke or transient ischemic attack (TIA), accompanie", "d": "2026-10-21", "dl": "Wednesday, October 21", "y": "preprints"}, {"l": "https://www.medrxiv.org/content/10.64898/2026.10.15.26365689v1?rss=1", "t": "Renovascular hypertension drives ischemic white matter injury via brain endothelial AT1R signaling", "s": "medRxiv Neurology", "m": "BACKGROUND: White matter hyperintensities (WMHs), the principal imaging manifestation of cerebral small vessel disease, lack an animal model that produces pathology of sufficient magnitude to validate potential therapeutics. We characterized white matter (WM) degeneration in a renovascular hypertension (RVH) rat model, interrogated its mechanism, and tested its relevance in patients. METHODS: RVH was induced by two-kidney, two-clip surgery and assessed by T2-weighted and diffusion MRI, myelin and axonal histology, and blood-brain barrier (BBB) leakage markers. The influence of angiotensin II (Ang II) on barrier function in brain endothelial cells was examined using transendothelial electrica", "d": "2026-10-21", "dl": "Wednesday, October 21", "y": "preprints"}, {"l": "https://www.medrxiv.org/content/10.64898/2026.10.15.26365563v1?rss=1", "t": "Interictal functional ultrasound imaging in human epilepsy resection and responsive neurostimulation surgery", "s": "medRxiv Neurology", "m": "Over 30% of patients with epilepsy are refractory to medication and may require surgical or neuromodulation-based intervention. Accurate t. DART learns short, interpretable Boolean gene rules and assembles several gene-disjoint rules per cell type. Its detection-aware training thins the reference to per-gene detection rates measured in a different, already completed experiment, so no Xenium data from the target tissue are needed before the panel is ordered. On held-out Xen", "d": "2026-10-21", "dl": "Wednesday, October 21", "y": "preprints"}, {"l": "https://www.biorxiv.org/content/10.64898/2026.10.19.760026v1?rss=1", "t": "Predicting cell-state-specific gene regulation from DNA across species", "s": "bioRxiv Genomics", "m": "DNA encodes the cell's phenotype, but the same DNA sequence is interpreted differently in every cell type, developmental stage, and activity state. Existing deep-learning models solve only half of this puzzle: sequence-to-function models read DNA but treat cell state as a fixed label, while single-cell foundation models represent cell state but not sequence. We developed Bolero, a sequence-to-function model whose parameters condition on atlas-scale cell-state embeddings and additional biological variables to predict cell-state-specific chromatin accessibility and transcript abundance from DNA. Trained on 10.7 million cells from 33 datasets across six mammals, Bolero matched or exceeded speci", "d": "2026-10-21", "dl": "Wednesday, October 21", "y": "preprints"}, {"l": "https://www.cell.com/cell-reports/fulltext/S2211-1247(26)01249-0?rss=yes", "t": "The TCF-1-E-protein axis preserves stem-like Th17 identity and prevents autoimmune pathology", "s": "Cell Reports", "m": "Han et al. show that TCF-1 deficiency in Th17 cells exacerbates autoimmune neuroinflammation. They uncover a reciprocal TCF-1-E-protein transcriptional circuit that preserves stem-like Th17 identity and prevents pathogenic conversion. Disruption of this circuit unleashes pathogenic Th17 cells, revealing a critical checkpoint in autoimmune disease.", "d": "2026-10-21", "dl": "Wednesday, October 21", "y": "research"}, //www.biorxiv.org/content/10.64898/2026.10.18.759942v1?rss=1", "t": "BNIP3L/NIX-mediated mitophagy limits Alzheimer disease pathology and preserves neuronal function", "s": "bioRxiv Cell Biology", "m": "Defective mitophagy is emerging as a key contributor to Alzheimer disease (AD), but the neuronal pathways governing mitochondrial clearance and their contribution to disease progression remain poorly understood. Here, we identify BNIP3L/NIX-dependent mitophagy as a conserved neuronal quality control pathway that maintains mitochondrial fitness and constrains AD-associated proteotoxicity. Loss of BNIP3L/NIX or its C. elegans orthologue DCT-1 impaired basal and stressed-induced mitophagy, disrupted mitochondrial homeostasis, enhanced Tau and Amyloid-beta pathology and compromised neuronal network, synaptic and behavioral function across human neuronal and in vivo models. Conversely, restoring ", "d": "2026-10-21", "dl": "Wednesday, October 21", "y": "preprints"}, {"l": "https://www.biorxiv.org/content/10.64898/2026.10.14.759236v1?rss=1", "t": "Aquamin: A Source of Bioavailable Calcium, Magnesium, and Additional Cationic Trace Elements in Colon Health and Beyond", "s": "bioRxiv Molecular Biology", "m": "Introduction: Aquamin is a calcium- and magnesium-rich natural product derived from marine red algae that contains multiple trace elements. Human and mouse studies have demonstrated potential health benefits. Methods: Aquamin and calcium carbonate were compared using a two-stage simulated gastric and intestinal digestion protocol. ICP-OES/ICP-MS was used to quantify cationic elements in soluble and insoluble fractions. Binding of dispersed mineral powders to human colon epithelial cells was assessed by light and scanning electron microscopy, and uptake was assessed by transmission electron microscopy. TMT-based proteomics identified protein changes in colon epithelial organoids following min", "d": "2026-10-21", "dl": "Wednesday, October 21", "y": "preprints"}, {"l": "ht 28v1?rss=1", "t": "ALSmiR: a curated evidence resource for ALS-associated microRNAs for biomarker discovery", "s": "bioRxiv Bioinformatics", "m": "Amyotrophic lateral sclerosis is a multifactorial, late-onset neurodegenerative disease with incompletely understood pathogenesis. Limited survival after symptom onset creates an urgent need for biomarkers to support diagnosis, prognosis, and patient stratification. MicroRNAs are among the candidate biomarkers investigated in this disease. Although reviews have synthesized microRNA expression findings, differences in patient populations, biospecimens, and methods complicate comparisons. In the age of data-driven research, we need an updated, searchable resource that links each finding to its context and incorporates growing evidence. Here, we present ALSmiR, a public, manually curated databa", "d": "2026-10-21", "dl": "Wednesday, October 21", "y": "preprints"}, {"l": "https://www.biorxiv.org/content/10.64898/2026.10.14.758936v1?rss=1", "t": "A Multidimensional Arithmetical Ontology for High-Parameter Cytometry: Gaussian Primes and Cryptographic Hashing for Cell Population Standardization", "s": "bioRxiv Bioinformatics", "m": "Background. The rapid expansion of high-dimensional single-cell technologies has outpaced the development of standardized metadata infrastructure. Current text-based nomenclature for cell populations and gating strategies lacks computational rigor, hindering cross-study reproducibility and automated machine learning. Our previous mathematical frameworks, the Prime Population System (PPS) and the Unique Gating Identifier (UGI), proposed arithmetical solutions but were limited by biological fragility (no inherent link between a protein and its structural isoforms) and by computational bottlenecks caused by exponential integer growth. Objective. To develop a scalable, multidimensional arithmeti", "d": "2026-10-21", "dl": "Wednesday, October 21", "y": "preprints"}, {"l": "https://www.nature.com/articles/  "0 new of 8"], ["Nature Biotechnology", "0 new of 8"], ["Nature Communications", "no entries (HTTP 301) (SAXParseException)"], ["Nature Genetics", "0 new of 8"], ["Nature Medicine", "0 new of 8"], ["Nature Methods", "0 new of 8"], ["Nature Neuroscience", "0 new of 8"], ["Nature Reviews Neurology", "0 new of 8"], ["Nature Reviews Neuroscience", "0 new of 8"], ["Neurobiology of Aging", "0 new of 4 (via Crossref)"], ["Neuron", "0 new of 14"], ["Science", "0 new of 41"], ["Science Translational Medicine", "0 new of 8"], ["Scientific Reports (Neuroscience)", "no entries (HTTP 200) (SAXParseException)"], ["Stem Cell Reports", "0 new of 20"], ["arXiv cs.AI", "no entries (HTTP 200)"], ["arXiv cs.LG", "no entries (HTTP 200)"], ["arXiv q-bio.GN", "no entries (HTTP 200)"], ["arXiv q-bio.NC", "no entries (HTTP 200)"], ["arXiv q-bio.QM", "no entries (HTTP 200)"], ["arXiv stat.ML", "no entries (HTTP 200)"], ["bioRxiv Bioinformatics", "0 new of 30"], ["bioRxiv Cell Biology", "0 new of 30"], ["bioRxiv Genetics", "0 new of 30"], ["bioRxiv Genomics", "0 new of 30"], ["bioRxiv Molecular Biology", "0 new of 30"], ["bioRxiv Neuroscience", "0 new of 30"], ["eLife", "0 new of 28"], ["medRxiv Neurology", "0 new of 30"]], "updated": "Sun Oct 25, 6:56 AM PDT", "keep": 14}</script>
<script>
(function(){
const D=JSON.parse(document.getElementById('data').textContent);
const TABS=[["research","Research"],["preprints","Preprints"],["reviews","Reviews"],["commentary","Commentary"],["clinical","Clinical"],["folders","Folders"]];
const KEY='morning-papers-v1';
let store={folders:[],items:{}};
try{const s=localStorage.getItem(KEY);if(s)store=JSON.parse(s);}catch(e){}
if(!Array.isArray(store.folders))store.folders=[];
if(!store.items||typeof store.items!=='object')store.items={};
function persist(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}

let tab=(location.hash||'#research').slice(1);
if(!TABS.some(t=>t[0]===tab))tab='research';
let folderSel=null;

function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function safeUrl(u){return /^https?:\/\//i.test(u||'')?u:'#';}
function uid(){return 'f'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function folderById(id){return store.folders.find(f=>f.id===id);}

document.getElementById('sub').textContent='Updated '+D.updated+' \u00b7 '+D.papers.length+' papers in the last '+D.keep+' days';
const st=document.getElementById('status');
D.status.forEach(s=>st.append(el('li',null,s[0]+': '+s[1])));

/* ---------- saving ---------- */
function toggle(p,fid,on){
  let it=store.items[p.l];
  if(!it)it=store.items[p.l]={l:p.l,t:p.t,s:p.s,m:p.m,saved:Date.now(),folders:[]};
  const i=it.folders.indexOf(fid);
  if(on&&i<0)it.folders.push(fid);
  if(!on&&i>=0)it.folders.splice(i,1);
  if(!it.folders.length)delete store.items[p.l];
  persist();
}
function count(p){const it=store.items[p.l];return it?it.folders.length:0;}
function label(btn,p){const n=count(p);btn.textContent=n?'Saved in '+n:'Save';btn.classList.toggle('on',n>0);}

function fillPanel(panel,p,btn){
  panel.replaceChildren();
  const it=store.items[p.l];
  if(!store.folders.length)panel.append(el('div','note','No folders yet. Create one below.'));
  store.folders.forEach(f=>{
    const lab=el('label');
    const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!(it&&it.folders.includes(f.id));
    cb.onchange=()=>{toggle(p,f.id,cb.checked);label(btn,p);};
    lab.append(cb,' '+f.name+' ',el('span','note','('+(f.kind==='project'?'project':'question')+')'));
    panel.append(lab);
  });
  const row=el('div','row');
  const inp=document.createElement('input');inp.type='text';inp.placeholder='New folder name';
  const sel=document.createElement('select');
  [['project','Project'],['question','Question']].forEach(o=>{const op=el('option',null,o[1]);op.value=o[0];sel.append(op);});
  const add=el('button','btn','Create + save here');
  add.onclick=()=>{
    const name=inp.value.trim();if(!name)return;
    const f={id:uid(),name:name,kind:sel.value};
    store.folders.push(f);toggle(p,f.id,true);label(btn,p);fillPanel(panel,p,btn);
  };
  row.append(inp,sel,add);panel.append(row);
}

function card(p){
  const a=el('article','paper');
  const t=el('a','t',p.t);t.href=safeUrl(p.l);t.target='_blank';t.rel='noopener noreferrer';
  a.append(t,el('br'),el('span','src',p.s));
  const btn=el('button','save');label(btn,p);
  const panel=el('div','panel');panel.hidden=true;
  btn.onclick=()=>{panel.hidden=!panel.hidden;if(!panel.hidden)fillPanel(panel,p,btn);};
  a.append(btn);
  if(p.m){const d=el('details');d.append(el('summary',null,'Abstract'),el('p',null,p.m));a.append(d);}
  a.append(panel);
  return a;
}

/* ---------- views ---------- */
function matches(p,q){return !q||(p.t+' '+p.s+' '+(p.m||'')).toLowerCase().includes(q);}

function renderTabs(){
  const nav=document.getElementById('tabs');nav.replaceChildren();
  TABS.forEach(t=>{
    const n=t[0]==='folders'?store.folders.length:D.papers.filter(p=>p.y===t[0]).length;
    const b=el('button',t[0]===tab?'on':'',t[1]);b.append(el('small',null,String(n)));
    b.onclick=()=>{tab=t[0];location.hash=tab;render();};
    nav.append(b);
  });
}

function renderPapers(view,q){
  const list=D.papers.filter(p=>p.y===tab&&matches(p,q));
  if(!list.length){view.append(el('p','empty',q?'Nothing matches that filter.':'No papers here yet.'));return;}
  let day=null,sec=null;
  list.forEach(p=>{
    if(p.d!==day){
      day=p.d;sec=el('section','day');
      const h=el('h2',null,p.dl+' ');h.append(el('span',null,'('+list.filter(x=>x.d===day).length+')'));
      sec.append(h);view.append(sec);
    }
    sec.append(card(p));
  });
}

function folderCount(f){return Object.values(store.items).filter(i=>i.folders.includes(f.id)).length;}

function renderFolders(view,q){
  const form=el('div','fform');
  const inp=document.createElement('input');inp.type='text';inp.placeholder='New folder name';
  const sel=document.createElement('select');
  [['project','Project'],['question','Question']].forEach(o=>{const op=el('option',null,o[1]);op.value=o[0];sel.append(op);});
  const add=el('button','btn','Create folder');
  add.onclick=()=>{const n=inp.value.trim();if(!n)return;const f={id:uid(),name:n,kind:sel.value};store.folders.push(f);persist();folderSel=f.id;render();};
  form.append(inp,sel,add);view.append(form);

  [['project','Projects'],['question','Questions']].forEach(g=>{
    const fs=store.folders.filter(f=>f.kind===g[0]);
    if(!fs.length)return;
    view.append(el('div','fgroup',g[1]));
    const chips=el('div','fchips');
    fs.forEach(f=>{
      const b=el('button',f.id===folderSel?'on':'',f.name+' ('+folderCount(f)+')');
      b.onclick=()=>{folderSel=f.id;render();};chips.append(b);
    });
    view.append(chips);
  });
  if(!store.folders.length)view.append(el('p','empty','Make a folder for a project (e.g. "MAPT off-targets") or a question (e.g. "Does tau spread via microglia?"), then use Save on any paper.'));

  const f=folderById(folderSel);
  if(f){
    const tools=el('div','ftools');
    const ren=el('button','btn','Rename');
    ren.onclick=()=>{const n=prompt('Folder name',f.name);if(n&&n.trim()){f.name=n.trim();persist();render();}};
    const del=el('button','btn','Delete folder');
    del.onclick=()=>{
      if(!confirm('Delete "'+f.name+'"? Papers stay saved in any other folders.'))return;
      store.folders=store.folders.filter(x=>x.id!==f.id);
      Object.keys(store.items).forEach(k=>{const it=store.items[k];it.folders=it.folders.filter(x=>x!==f.id);if(!it.folders.length)delete store.items[k];});
      folderSel=null;persist();render();
    };
    tools.append(ren,del);view.append(tools);
    const papers=Object.values(store.items).filter(i=>i.folders.includes(f.id)&&matches(i,q)).sort((a,b)=>b.saved-a.saved);
    if(!papers.length)view.append(el('p','empty','Nothing saved here yet.'));
    papers.forEach(p=>view.append(card(p)));
  }

  const bk=el('div','ftools');
  const exp=el('button','btn','Export backup');
  exp.onclick=()=>{
    const blob=new Blob([JSON.stringify(store,null,1)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='morning-papers-folders.json';a.click();
  };
  const imp=el('button','btn','Import backup');
  const file=document.createElement('input');file.type='file';file.accept='application/json';file.hidden=true;
  file.onchange=()=>{
    const r=new FileReader();
    r.onload=()=>{
      try{
        const o=JSON.parse(r.result);
        (o.folders||[]).forEach(f=>{if(f&&f.id&&f.name&&!folderById(f.id))store.folders.push({id:String(f.id),name:String(f.name),kind:f.kind==='question'?'question':'project'});});
        Object.values(o.items||{}).forEach(i=>{
          if(!i||!i.l)return;
          const cur=store.items[i.l]||(store.items[i.l]={l:String(i.l),t:String(i.t||''),s:String(i.s||''),m:String(i.m||''),saved:Number(i.saved)||Date.now(),folders:[]});
          (i.folders||[]).forEach(id=>{if(folderById(id)&&!cur.folders.includes(id))cur.folders.push(id);});
          if(!cur.folders.length)delete store.items[i.l];
        });
        persist();render();
      }catch(e){alert('That file could not be read.');}
    };
    r.readAsText(file.files[0]);
  };
  imp.onclick=()=>file.click();
  bk.append(exp,imp,file);view.append(bk);
  view.append(el('p','note','Folders are saved in this browser only. Your phone and laptop will not share them; use Export/Import to move them across.'));
}

function render(){
  renderTabs();
  const view=document.getElementById('view');view.replaceChildren();
  const q=document.getElementById('q').value.trim().toLowerCase();
  if(tab==='folders')renderFolders(view,q);else renderPapers(view,q);
}
document.getElementById('q').addEventListener('input',render);
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h)){tab=h;render();}});
render();
})();
</script>
</body></html>
